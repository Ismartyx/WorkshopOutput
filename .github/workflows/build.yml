name: Build Workshop Output APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Permanent Keystore
        run: |
          if [ ! -f output.keystore ]; then
            keytool -genkey -v -keystore output.keystore -alias output -keyalg RSA -keysize 2048 -validity 10000 -storepass outputpass -keypass outputpass -dname "CN=Workshop Output"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output.keystore
            git commit -m "Add permanent keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Signed APK
        run: |
          cordova create app com.kargah.output "خروجی کارگاه"
          rm -rf app/www/* && cp index.html app/www/
          if [ -f icon.png ]; then
            cp icon.png app/
            sed -i 's|</widget>|    <icon src="icon.png" />\n</widget>|' app/config.xml
          fi
          sed -i 's|</widget>|    <access origin="*" />\n    <allow-navigation href="*" />\n    <preference name="AndroidInsecureFileModeEnabled" value="true" />\n</widget>|' app/config.xml
          cd app
          cat <<EOF > build.json
          {
            "android": {
              "release": {
                "keystore": "$GITHUB_WORKSPACE/output.keystore",
                "storePassword": "outputpass",
                "alias": "output",
                "password": "outputpass",
                "keystoreType": "",
                "packageType": "apk"
              }
            }
          }
          EOF
          cordova plugin add cordova-plugin-x-socialsharing
          cordova plugin add cordova-plugin-advanced-http
          cordova platform add android
          cordova build android --release --buildConfig=build.json -- --packageType=apk
          find platforms/android/ -name "*.apk" -exec cp {} ../WorkshopOutput.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: WorkshopOutput-APK
          path: "WorkshopOutput.apk"
